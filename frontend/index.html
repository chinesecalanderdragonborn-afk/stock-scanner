<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCOUT — Momentum Scanner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📈</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand"><span class="mk">◆</span> <b>SCOUT</b> <small>momentum scanner</small>
        <span class="chip" id="mode">…</span></div>
      <div class="idx" id="idx"></div>
      <div class="spacer"></div>
      <div class="clock"><span class="t mono" id="clock">--:--:--</span>
        <small>to close <b id="cd" class="mono">--:--</b></small></div>
      <button class="tbtn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </header>

    <main class="grid">
      <section class="ideas">
        <div class="tabs" id="tabs"></div>
        <div class="tablewrap">
          <table>
            <thead><tr>
              <th>Symbol</th><th>Last</th><th>Chg%</th><th>RVol</th><th>Float</th><th>Signal</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="detail">
        <div class="dhead">
          <div class="dsym">
            <span class="cs" id="cSym">—</span>
            <span class="cp mono" id="cPrice"></span>
            <span class="cc mono" id="cChg"></span>
          </div>
          <div class="dmeta mono" id="cMeta"></div>
          <div class="tf" id="tf">
            <button data-tf="1m" class="on">1m</button>
            <button data-tf="5m">5m</button>
          </div>
        </div>
        <div class="chartwrap"><canvas id="chart"></canvas></div>
        <div class="stats" id="stats"></div>

        <div class="plan" id="plan">
          <div class="planhead">
            <div class="h">Trade plan <span class="grade" id="pGrade">—</span></div>
            <div class="risk">
              <label>Acct $<input id="rAcct" class="mono" type="number" min="0" step="1000" /></label>
              <label>Risk %<input id="rPct" class="mono" type="number" min="0" step="0.25" /></label>
            </div>
          </div>
          <div class="planbody" id="planbody">
            <div class="muted" style="padding:10px 0">— select a name for its plan —</div>
          </div>
        </div>

        <div class="news">
          <div class="h">News wire</div>
          <div id="news"></div>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="status">connecting…</span>
      <span id="lastUpdate" class="mono"></span>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
